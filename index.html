<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantitative Aptitude Examination Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <script>
        // Default seed data for initial setup
        const DEFAULT_USERS = [
            { username: 'admin', password: 'admin123', role: 'admin', name: 'Dr. R. Sharma' },
            { username: 'student', password: 'student123', role: 'student', name: 'Aarav Patel' },
            { username: 'student2', password: 'student123', role: 'student', name: 'Priya Singh' }
        ];

        const DEFAULT_QUESTIONS = [
            {
                id: 1,
                topic: 'Arithmetic',
                question: 'A shopkeeper sells an article at a 20% profit. If he had bought it at 10% less and sold it for $18 less, he would have gained 25%. Find the cost price of the article.',
                options: ['$100', '$120', '$150', '$200'],
                correct: 1, // index 1 = $120
                explanation: 'Let CP = 100x. SP1 = 120x. New CP = 90x. New SP = 90x * 1.25 = 112.5x. Difference = 120x - 112.5x = 7.5x = 18. Solving gives CP = 120.'
            },
            {
                id: 2,
                topic: 'Arithmetic',
                question: 'Pipe A can fill an empty tank in 6 hours, and Pipe B can empty the full tank in 8 hours. If both pipes are opened simultaneously when the tank is empty, in how many hours will the tank be completely filled?',
                options: ['12 hours', '18 hours', '24 hours', '32 hours'],
                correct: 2, // index 2 = 24 hours
                explanation: 'Net work in 1 hour = 1/6 - 1/8 = 1/24. Thus, the tank will be filled in 24 hours.'
            },
            {
                id: 3,
                topic: 'Algebra',
                question: 'If x + 1/x = 5, find the value of x^3 + 1/x^3.',
                options: ['110', '125', '140', '150'],
                correct: 0, // index 0 = 110
                explanation: 'Formula: x^3 + 1/x^3 = k^3 - 3k where k = 5. So, 125 - 15 = 110.'
            },
            {
                id: 4,
                topic: 'Algebra',
                question: 'Find the roots of the quadratic equation: 2x^2 - 7x + 3 = 0.',
                options: ['3, 1/2', '-3, -1/2', '2, 3', '1, 3/2'],
                correct: 0, // index 0 = 3, 1/2
                explanation: 'Factoring 2x^2 - 6x - x + 3 = 0 => 2x(x - 3) - 1(x - 3) = 0 => (2x - 1)(x - 3) = 0. Roots are x = 3, x = 1/2.'
            },
            {
                id: 5,
                topic: 'Geometry',
                question: 'The perimeter of a rhombus is 100 cm and one of its diagonals is 14 cm. Find the length of the other diagonal in cm.',
                options: ['24', '48', '50', '96'],
                correct: 1, // index 1 = 48
                explanation: 'Side = 100 / 4 = 25 cm. Diagonals bisect at right angles: (d1/2)^2 + (d2/2)^2 = side^2 => 7^2 + (d2/2)^2 = 25^2 => d2/2 = 24 => d2 = 48.'
            },
            {
                id: 6,
                topic: 'Geometry',
                question: 'What is the area of an equilateral triangle whose height is 6√3 cm?',
                options: ['18√3 sq cm', '36√3 sq cm', '54√3 sq cm', '72 sq cm'],
                correct: 1, // index 1 = 36√3 sq cm
                explanation: 'Height h = (√3/2) * side = 6√3 => side = 12. Area = (√3/4) * side^2 = 36√3.'
            },
            {
                id: 7,
                topic: 'Number Systems',
                question: 'What is the unit digit of the expression: (7^95) * (3^58)?',
                options: ['1', '3', '7', '9'],
                correct: 1, // index 1 = 3
                explanation: 'For 7^95: 95 mod 4 = 3, so unit digit is 7^3 = 3. For 3^58: 58 mod 4 = 2, so unit digit is 3^2 = 9. Product = 3 * 9 = 27, unit digit is 3.'
            },
            {
                id: 8,
                topic: 'Number Systems',
                question: 'Find the least number which when divided by 12, 16, and 24 leaves a remainder 7 in each case.',
                options: ['41', '47', '55', '95'],
                correct: 2, // index 2 = 55
                explanation: 'LCM of 12, 16, and 24 is 48. Required number = LCM + remainder = 48 + 7 = 55.'
            }
        ];

        // Initialize LocalStorage if empty
        if (!localStorage.getItem('quant_users')) {
            localStorage.setItem('quant_users', JSON.stringify(DEFAULT_USERS));
        }
        if (!localStorage.getItem('quant_questions')) {
            localStorage.setItem('quant_questions', JSON.stringify(DEFAULT_QUESTIONS));
        }
        if (!localStorage.getItem('quant_attempts')) {
            localStorage.setItem('quant_attempts', JSON.stringify([]));
        }

        // Session helper
        function getCurrentUser() {
            const userStr = sessionStorage.getItem('quant_current_user');
            return userStr ? JSON.parse(userStr) : null;
        }

        function setCurrentUser(user) {
            if (user) {
                sessionStorage.setItem('quant_current_user', JSON.stringify(user));
            } else {
                sessionStorage.removeItem('quant_current_user');
            }
        }
    </script>

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-lg tracking-wider">QA</div>
                <div>
                    <h1 class="text-base font-bold text-slate-900">QuantExaminer Pro</h1>
                    <p class="text-xs text-slate-500">Quantitative Aptitude Evaluation Suite</p>
                </div>
            </div>
            <div id="nav-auth-section" class="flex items-center space-x-4">
                <!-- Dynamically populated via JS -->
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="app-container">
            <!-- Dynamic Views Loaded Here -->
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            &copy; 2026 QuantExaminer Pro. Secure Academic Examination & Analytics Portal.
        </div>
    </footer>

    <script>
        // Global state for ongoing exam
        let activeExamState = null;
        let examTimerInterval = null;

        window.addEventListener('DOMContentLoaded', () => {
            renderRouter();
        });

        function renderRouter() {
            const user = getCurrentUser();
            renderNavbar(user);
            const container = document.getElementById('app-container');
            
            if (!user) {
                container.innerHTML = getLoginTemplate();
                attachLoginListeners();
            } else if (user.role === 'admin') {
                container.innerHTML = getAdminDashboardTemplate();
                attachAdminListeners();
            } else if (user.role === 'student') {
                if (activeExamState) {
                    container.innerHTML = getActiveExamTemplate();
                    attachExamListeners();
                } else {
                    container.innerHTML = getStudentDashboardTemplate();
                    attachStudentListeners();
                }
            }
        }

        function renderNavbar(user) {
            const navAuth = document.getElementById('nav-auth-section');
            if (!user) {
                navAuth.innerHTML = `<span class="text-xs text-slate-500 hidden sm:inline">Secure Access Portal</span>`;
            } else {
                navAuth.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <div class="text-right hidden sm:block">
                            <div class="text-sm font-semibold text-slate-800">${escapeHtml(user.name)}</div>
                            <div class="text-xs text-indigo-600 uppercase font-bold tracking-wider">${user.role}</div>
                        </div>
                        <button onclick="handleLogout()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                            Sign Out
                        </button>
                    </div>
                `;
            }
        }

        function handleLogout() {
            if (activeExamState && confirm("An exam is currently in progress. Exiting will discard your current attempt. Are you sure?")) {
                activeExamState = null;
                if (examTimerInterval) clearInterval(examTimerInterval);
            } else if (activeExamState) {
                return;
            }
            setCurrentUser(null);
            renderRouter();
        }

        // ==========================================
        // AUTHENTICATION VIEW & LOGIC
        // ==========================================
        function getLoginTemplate() {
            return `
                <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mt-12">
                    <div class="bg-indigo-600 px-6 py-6 text-white">
                        <h2 class="text-xl font-bold">Portal Authentication</h2>
                        <p class="text-indigo-100 text-sm mt-1">Sign in with your registered credentials</p>
                    </div>
                    <div class="p-6 sm:p-8">
                        <div id="login-error" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-lg"></div>
                        <form id="login-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Username</label>
                                <input type="text" id="login-username" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
                                <input type="password" id="login-password" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">
                                Sign In
                            </button>
                        </form>

                        <div class="mt-8 pt-6 border-t border-slate-100">
                            <p class="text-xs font-semibold uppercase text-slate-400 mb-3 tracking-wider">Quick Demo Credentials</p>
                            <div class="grid grid-cols-2 gap-2">
                                <button onclick="fillDemo('admin', 'admin123')" class="p-2.5 text-left border border-slate-200 hover:border-indigo-300 rounded-lg bg-slate-50 hover:bg-indigo-50/50 transition">
                                    <div class="text-xs font-bold text-indigo-700">Admin Portal</div>
                                    <div class="text-[11px] text-slate-500">admin / admin123</div>
                                </button>
                                <button onclick="fillDemo('student', 'student123')" class="p-2.5 text-left border border-slate-200 hover:border-indigo-300 rounded-lg bg-slate-50 hover:bg-indigo-50/50 transition">
                                    <div class="text-xs font-bold text-indigo-700">Student Portal</div>
                                    <div class="text-[11px] text-slate-500">student / student123</div>
                                </button>
                            </div>
                        </div>

                        <div class="mt-6 text-center">
                            <p class="text-xs text-slate-500">New student? <button onclick="showRegisterModal()" class="text-indigo-600 font-medium hover:underline">Register account</button></p>
                        </div>
                    </div>
                </div>

                <!-- Registration Modal -->
                <div id="register-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
                    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 sm:p-8">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-bold text-slate-900">Student Account Registration</h3>
                            <button onclick="hideRegisterModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
                        </div>
                        <div id="register-error" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-lg"></div>
                        <form id="register-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Full Name</label>
                                <input type="text" id="reg-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Username</label>
                                <input type="text" id="reg-username" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Password</label>
                                <input type="password" id="reg-password" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                            </div>
                            <div class="flex justify-end space-x-3 pt-2">
                                <button type="button" onclick="hideRegisterModal()" class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg text-sm font-medium hover:bg-slate-100">Cancel</button>
                                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">Register</button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function fillDemo(u, p) {
            document.getElementById('login-username').value = u;
            document.getElementById('login-password').value = p;
        }

        function showRegisterModal() {
            document.getElementById('register-modal').classList.remove('hidden');
        }

        function hideRegisterModal() {
            document.getElementById('register-modal').classList.add('hidden');
        }

        function attachLoginListeners() {
            document.getElementById('login-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const u = document.getElementById('login-username').value.trim();
                const p = document.getElementById('login-password').value;
                const users = JSON.parse(localStorage.getItem('quant_users')) || [];
                
                const found = users.find(x => x.username === u && x.password === p);
                if (found) {
                    setCurrentUser(found);
                    renderRouter();
                } else {
                    const err = document.getElementById('login-error');
                    err.textContent = 'Invalid username or password.';
                    err.classList.remove('hidden');
                }
            });

            document.getElementById('register-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('reg-name').value.trim();
                const username = document.getElementById('reg-username').value.trim();
                const password = document.getElementById('reg-password').value;

                const users = JSON.parse(localStorage.getItem('quant_users')) || [];
                if (users.some(x => x.username === username)) {
                    const err = document.getElementById('register-error');
                    err.textContent = 'Username already exists.';
                    err.classList.remove('hidden');
                    return;
                }

                users.push({ username, password, role: 'student', name });
                localStorage.setItem('quant_users', JSON.stringify(users));
                hideRegisterModal();
                alert('Registration successful! Please sign in with your credentials.');
            });
        }


        // ==========================================
        // ADMIN DASHBOARD & ANALYTICS
        // ==========================================
        function getAdminDashboardTemplate() {
            const users = JSON.parse(localStorage.getItem('quant_users')) || [];
            const students = users.filter(u => u.role === 'student');
            const attempts = JSON.parse(localStorage.getItem('quant_attempts')) || [];
            const questions = JSON.parse(localStorage.getItem('quant_questions')) || [];

            // Calculate overall stats
            const totalAttemptsCount = attempts.length;
            const avgScore = totalAttemptsCount > 0 
                ? Math.round(attempts.reduce((acc, curr) => acc + (curr.score / curr.total), 0) / totalAttemptsCount * 100) 
                : 0;

            return `
                <div class="space-y-6">
                    <!-- Top Overview Cards -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div class="text-xs font-semibold uppercase text-slate-500 mb-1">Registered Students</div>
                            <div class="text-3xl font-bold text-slate-900">${students.length}</div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div class="text-xs font-semibold uppercase text-slate-500 mb-1">Total Exam Attempts</div>
                            <div class="text-3xl font-bold text-slate-900">${totalAttemptsCount}</div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                            <div class="text-xs font-semibold uppercase text-slate-500 mb-1">Average Batch Accuracy</div>
                            <div class="text-3xl font-bold text-indigo-600">${avgScore}%</div>
                        </div>
                    </div>

                    <!-- Navigation Tabs -->
                    <div class="flex border-b border-slate-200 space-x-6">
                        <button onclick="switchAdminTab('students')" id="tab-btn-students" class="pb-3 text-sm font-semibold border-b-2 border-indigo-600 text-indigo-600 transition">Student Performance & Analytics</button>
                        <button onclick="switchAdminTab('questions')" id="tab-btn-questions" class="pb-3 text-sm font-semibold border-b-2 border-transparent text-slate-500 hover:text-slate-800 transition">Question Bank Management</button>
                    </div>

                    <!-- Tab 1: Student Performance & Analytics -->
                    <div id="admin-tab-students" class="space-y-6">
                        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                                <h3 class="font-bold text-slate-900">Student Roster & Attempts</h3>
                                <span class="text-xs text-slate-500">Click student name to view detailed breakdown</span>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase">
                                            <th class="px-6 py-3">Student Name</th>
                                            <th class="px-6 py-3">Username</th>
                                            <th class="px-6 py-3">Total Attempts</th>
                                            <th class="px-6 py-3">Latest Score</th>
                                            <th class="px-6 py-3">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 text-sm">
                                        ${students.length === 0 ? `<tr><td colspan="5" class="px-6 py-6 text-center text-slate-500">No students registered yet.</td></tr>` : 
                                          students.map(st => {
                                              const stAttempts = attempts.filter(a => a.username === st.username);
                                              const latest = stAttempts[stAttempts.length - 1];
                                              return `
                                                <tr class="hover:bg-slate-50/50 transition">
                                                    <td class="px-6 py-4 font-semibold text-slate-900">${escapeHtml(st.name)}</td>
                                                    <td class="px-6 py-4 text-slate-600">${escapeHtml(st.username)}</td>
                                                    <td class="px-6 py-4 text-slate-600">${stAttempts.length}</td>
                                                    <td class="px-6 py-4">
                                                        ${latest ? `<span class="px-2.5 py-1 rounded-full text-xs font-bold ${latest.score >= (latest.total * 0.7) ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">${latest.score} / ${latest.total} (${Math.round((latest.score/latest.total)*100)}%)</span>` : '<span class="text-slate-400 text-xs">No attempts</span>'}
                                                    </td>
                                                    <td class="px-6 py-4">
                                                        <button onclick="viewStudentAnalytics('${st.username}')" class="text-indigo-600 hover:text-indigo-800 font-medium text-xs bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition">View Analytics</button>
                                                    </td>
                                                </tr>
                                              `;
                                          }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Detailed Student Analytics Container (Populated dynamically on click) -->
                        <div id="student-analytics-detail" class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
                            <!-- Injected via JS -->
                        </div>
                    </div>

                    <!-- Tab 2: Question Bank Management -->
                    <div id="admin-tab-questions" class="hidden space-y-6">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-slate-900 text-lg">Exam Question Repository</h3>
                            <button onclick="openQuestionModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">+ Add New Question</button>
                        </div>

                        <div class="grid grid-cols-1 gap-4">
                            ${questions.map((q, idx) => `
                                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 relative">
                                    <div class="flex justify-between items-start mb-2">
                                        <div class="flex items-center space-x-2">
                                            <span class="text-xs font-bold px-2.5 py-1 bg-slate-100 text-slate-700 rounded-lg">Q${idx + 1}</span>
                                            <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-lg">${escapeHtml(q.topic)}</span>
                                        </div>
                                        <div class="flex space-x-2">
                                            <button onclick="editQuestion(${q.id})" class="text-slate-500 hover:text-indigo-600 text-xs font-medium px-2.5 py-1 rounded border border-slate-200 hover:border-indigo-300 transition">Edit</button>
                                            <button onclick="deleteQuestion(${q.id})" class="text-rose-500 hover:text-rose-700 text-xs font-medium px-2.5 py-1 rounded border border-slate-200 hover:border-rose-300 transition">Delete</button>
                                        </div>
                                    </div>
                                    <p class="text-sm font-medium text-slate-900 mb-4">${escapeHtml(q.question)}</p>
                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-4">
                                        ${q.options.map((opt, oIdx) => `
                                            <div class="p-2.5 rounded-lg border text-xs ${oIdx === q.correct ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-semibold' : 'bg-slate-50 border-slate-200 text-slate-700'}">
                                                Option ${oIdx + 1}: ${escapeHtml(opt)} ${oIdx === q.correct ? ' (Correct)' : ''}
                                            </div>
                                        `).join('')}
                                    </div>
                                    <div class="text-xs text-slate-500 bg-slate-50 p-3 rounded-lg border border-slate-100">
                                        <span class="font-semibold text-slate-700">Explanation:</span> ${escapeHtml(q.explanation)}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>

                <!-- Add/Edit Question Modal -->
                <div id="question-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4 overflow-y-auto">
                    <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-6 sm:p-8 max-h-[90vh] overflow-y-auto">
                        <div class="flex justify-between items-center mb-4">
                            <h3 id="question-modal-title" class="text-lg font-bold text-slate-900">Add New Question</h3>
                            <button onclick="closeQuestionModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
                        </div>
                        <form id="question-form" class="space-y-4">
                            <input type="hidden" id="edit-question-id">
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Topic Category</label>
                                <select id="q-topic" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                                    <option value="Arithmetic">Arithmetic</option>
                                    <option value="Algebra">Algebra</option>
                                    <option value="Geometry">Geometry</option>
                                    <option value="Number Systems">Number Systems</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Question Statement</label>
                                <textarea id="q-statement" rows="3" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></textarea>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Option 1</label>
                                    <input type="text" id="q-opt-0" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">

        function viewStudentAnalytics(username) {
            const users = JSON.parse(localStorage.getItem('quant_users')) || [];
            const student = users.find(u => u.username === username);
            const attempts = JSON.parse(localStorage.getItem('quant_attempts')) || [];
            const stAttempts = attempts.filter(a => a.username === username);
            const questions = JSON.parse(localStorage.getItem('quant_questions')) || [];

            const container = document.getElementById('student-analytics-detail');
            container.classList.remove('hidden');

            if (stAttempts.length === 0) {
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="font-bold text-slate-900 text-lg">Analytics for ${escapeHtml(student.name)}</h4>
                        <button onclick="document.getElementById('student-analytics-detail').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
                    </div>
                    <p class="text-slate-500 text-sm">This student has not completed any exams yet.</p>
                `;
                return;
            }

            // Aggregate topic performance across all attempts
            const topics = ['Arithmetic', 'Algebra', 'Geometry', 'Number Systems'];
            const topicStats = {};
            topics.forEach(t => {
                topicStats[t] = { total: 0, correct: 0 };
            });

            stAttempts.forEach(att => {
                att.responses.forEach(resp => {
                    const qObj = questions.find(q => q.id === resp.questionId);
                    if (qObj && topicStats[qObj.topic]) {
                        topicStats[qObj.topic].total += 1;
                        if (resp.isCorrect) {
                            topicStats[qObj.topic].correct += 1;
                        }
                    }
                });
            });

            container.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h4 class="font-bold text-slate-900 text-lg">Comprehensive Analytics: ${escapeHtml(student.name)}</h4>
                        <p class="text-xs text-slate-500">Total Exams Completed: ${stAttempts.length}</p>
                    </div>
                    <button onclick="document.getElementById('student-analytics-detail').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    ${topics.map(t => {
                        const ts = topicStats[t];
                        const acc = ts.total > 0 ? Math.round((ts.correct / ts.total) * 100) : 0;
                        const isWeak = ts.total > 0 && acc < 50;
                        return `
                            <div class="p-4 rounded-xl border ${isWeak ? 'bg-rose-50 border-rose-200' : 'bg-slate-50 border-slate-200'}">
                                <div class="text-xs font-bold uppercase text-slate-600 mb-1">${t}</div>
                                <div class="text-2xl font-bold ${isWeak ? 'text-rose-600' : 'text-slate-900'}">${acc}%</div>
                                <div class="text-xs text-slate-500 mt-1">${ts.correct} of ${ts.total} correct</div>
                                ${isWeak ? `<div class="mt-2 inline-block px-2 py-0.5 bg-rose-200 text-rose-800 text-[10px] font-bold rounded">Weak Area (< 50%)</div>` : `<div class="mt-2 inline-block px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded">Proficient</div>`}
                            </div>
                        `;
                    }).join('')}
                </div>

                <h5 class="font-bold text-slate-900 mb-3">Attempt History</h5>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600 uppercase">
                                <th class="px-4 py-2">Attempt Date</th>
                                <th class="px-4 py-2">Score</th>
                                <th class="px-4 py-2">Percentage</th>
                                <th class="px-4 py-2">Time Taken</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            ${stAttempts.map(att => `
                                <tr>
                                    <td class="px-4 py-3 text-slate-700">${new Date(att.timestamp).toLocaleString()}</td>
                                    <td class="px-4 py-3 font-semibold text-slate-900">${att.score} / ${att.total}</td>
                                    <td class="px-4 py-3">
                                        <span class="px-2 py-1 rounded text-xs font-bold ${att.score >= (att.total*0.7) ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                            ${Math.round((att.score / att.total) * 100)}%
                                        </span>
                                    </td>
                                    <td class="px-4 py-3 text-slate-600">${Math.floor(att.timeTakenSeconds / 60)}m ${att.timeTakenSeconds % 60}s</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            container.scrollIntoView({ behavior: 'smooth' });
        }

        function openQuestionModal(qId = null) {
            const modal = document.getElementById('question-modal');
            const title = document.getElementById('question-modal-title');
            document.getElementById('question-form').reset();
            document.getElementById('edit-question-id').value = '';

            if (qId) {
                title.textContent = "Edit Question";
                const questions = JSON.parse(localStorage.getItem('quant_questions')) || [];
                const q = questions.find(x => x.id === qId);
                if (q) {
                    document.getElementById('edit-question-id').value = q.id;
                    document.getElementById('q-topic').value = q.topic;
                    document.getElementById('q-statement').value = q.question;
                    document.getElementById('q-opt-0').value = q.options[0];
                    document.getElementById('q-opt-1').value = q.options[1];
                    document.getElementById('q-opt-2').value = q.options[2];
                    document.getElementById('q-opt-3').value = q.options[3];
                    document.getElementById('q-correct').value = q.correct;
                    document.getElementById('q-explanation').value = q.explanation;
                }
            } else {
                title.textContent = "Add New Question";
            }
            modal.classList.remove('hidden');
        }

        function closeQuestionModal() {
            document.getElementById('question-modal').classList.add('hidden');
        }

        function editQuestion(id) {
            openQuestionModal(id);
        }

        function deleteQuestion(id) {
            if (confirm("Are you sure you want to delete this question?")) {
                let questions = JSON.parse(localStorage.getItem('quant_questions')) || [];
                questions = questions.filter(q => q.id !== id);
                localStorage.setItem('quant_questions', JSON.stringify(questions));
                renderRouter();
            }
        }

        function attachAdminListeners() {
            document.getElementById('question-form').addEventListener('submit', (e) => {
                e.preventDefault();
                const editId = document.getElementById('edit-question-id').value;
                const topic = document.getElementById('q-topic').value;
                const question = document.getElementById('q-statement').value;
                const options = [
                    document.getElementById('q-opt-0').value,
                    document.getElementById('q-opt-1').value,
                    document.getElementById('q-opt-2').value,
                    document.getElementById('q-opt-3').value
                ];
                const correct = parseInt(document.getElementById('q-correct').value);
                const explanation = document.getElementById('q-explanation').value;

                let questions = JSON.parse(localStorage.getItem('quant_questions')) || [];

                if (editId) {
                    const idx = questions.findIndex(q => q.id == editId);
                    if (idx !== -1) {
                        questions[idx] = { id: parseInt(editId), topic, question, options, correct, explanation };
                    }
                } else {
                    const newId = questions.length > 0 ? Math.max(...questions.map(q => q.id)) + 1 : 1;
                    questions.push({ id: newId, topic, question, options, correct, explanation });
                }

                localStorage.setItem('quant_questions', JSON.stringify(questions));
                closeQuestionModal();
                renderRouter();
            });
        }

        function startNewExam() {
            const questions = JSON.parse(localStorage.getItem('quant_questions')) || [];
            if (questions.length === 0) {
                alert("No questions available in the question bank. Please contact admin.");
                return;
            }

            activeExamState = {
                questions: questions,
                currentIndex: 0,
                answers: {}, // questionId -> selectedOptionIndex
                marked: {}, // questionId -> boolean
                visited: { [questions[0].id]: true },
                startTime: Date.now(),
                timeRemainingSeconds: questions.length * 90 // 1.5 minutes per question
            };

            renderRouter();
            startExamTimer();
        }

        function startExamTimer() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            examTimerInterval = setInterval(() => {
                if (!activeExamState) {
                    clearInterval(examTimerInterval);
                    return;
                }
                activeExamState.timeRemainingSeconds -= 1;
                const timerEl = document.getElementById('exam-timer');
                if (timerEl) {
                    const m = Math.floor(activeExamState.timeRemainingSeconds / 60);
                    const s = activeExamState.timeRemainingSeconds % 60;
                    timerEl.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    if (activeExamState.timeRemainingSeconds <= 60) {
                        timerEl.className = "text-rose-600 font-bold animate-pulse";
                    }
                }

                if (activeExamState.timeRemainingSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    alert("Time is up! Submitting exam automatically.");
                    submitExam();
                }
            }, 1000);
        }

                                <div class="flex justify-between items-center mb-4">

        function selectAnswer(qId, optionIdx) {
            activeExamState.answers[qId] = optionIdx;
            // Re-render palette/ui state without resetting timer
            const container = document.getElementById('app-container');
            container.innerHTML = getActiveExamTemplate();
        }

        function toggleMarkQuestion(qId) {
            activeExamState.marked[qId] = !activeExamState.marked[qId];
            const container = document.getElementById('app-container');
            container.innerHTML = getActiveExamTemplate();
        }

        function nextQuestion() {
            if (activeExamState.currentIndex < activeExamState.questions.length - 1) {
                activeExamState.currentIndex += 1;
                const container = document.getElementById('app-container');
                container.innerHTML = getActiveExamTemplate();
            }
        }

        function prevQuestion() {
            if (activeExamState.currentIndex > 0) {
                activeExamState.currentIndex -= 1;
                const container = document.getElementById('app-container');
                container.innerHTML = getActiveExamTemplate();
            }
        }

        function jumpToQuestion(idx) {
            activeExamState.currentIndex = idx;
            const container = document.getElementById('app-container');
            container.innerHTML = getActiveExamTemplate();
        }

        function confirmSubmitExam() {
            if (confirm("Are you sure you want to submit your exam? This action cannot be undone.")) {
                submitExam();
            }
        }

        function submitExam() {
            if (examTimerInterval) clearInterval(examTimerInterval);
            const state = activeExamState;
            const user = getCurrentUser();

            let score = 0;
            const responses = state.questions.map(q => {
                const selected = state.answers[q.id];
                const isCorrect = selected === q.correct;
                if (isCorrect) score += 1;
                return {
                    questionId: q.id,
                    selectedOption: selected !== undefined ? selected : null,
                    isCorrect: isCorrect
                };
            });

            const timeTakenSeconds = (state.questions.length * 90) - state.timeRemainingSeconds;

            const attemptRecord = {
                username: user.username,
                timestamp: Date.now(),
                score: score,
                total: state.questions.length,
                timeTakenSeconds: timeTakenSeconds,
                responses: responses
            };

            const attempts = JSON.parse(localStorage.getItem('quant_attempts')) || [];
            attempts.push(attemptRecord);
            localStorage.setItem('quant_attempts', JSON.stringify(attempts));

            activeExamState = null;
            renderRouter();
            alert(`Exam submitted successfully! Your Score: ${score} / ${state.questions.length}`);
        }

        function viewAttemptReport(attemptIdx) {
            const user = getCurrentUser();
            const attempts = JSON.parse(localStorage.getItem('quant_attempts')) || [];
            const myAttempts = attempts.filter(a => a.username === user.username);
            const att = myAttempts[attemptIdx];
            const questions = JSON.parse(localStorage.getItem('quant_questions')) || [];

            const modalContent = document.getElementById('report-modal-content');

            // Calculate topic breakdown for this attempt
            const topics = ['Arithmetic', 'Algebra', 'Geometry', 'Number Systems'];
            const topicSummary = {};
            topics.forEach(t => { topicSummary[t] = { total: 0, correct: 0 }; });

            att.responses.forEach(resp => {
                const qObj = questions.find(q => q.id === resp.questionId);
                if (qObj && topicSummary[qObj.topic]) {
                    topicSummary[qObj.topic].total += 1;
                    if (resp.isCorrect) topicSummary[qObj.topic].correct += 1;
                }
            });

            modalContent.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 class="text-xl font-bold text-slate-900">Detailed Exam Report</h3>
                        <p class="text-xs text-slate-500">Attempted on ${new Date(att.timestamp).toLocaleString()}</p>
                    </div>
                    <button onclick="document.getElementById('report-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div class="text-xs font-semibold uppercase text-slate-500 mb-1">Total Score</div>
                        <div class="text-2xl font-bold text-slate-900">${att.score} / ${att.total} (${Math.round((att.score/att.total)*100)}%)</div>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div class="text-xs font-semibold uppercase text-slate-500 mb-1">Time Taken</div>
                        <div class="text-2xl font-bold text-slate-900">${Math.floor(att.timeTakenSeconds / 60)}m ${att.timeTakenSeconds % 60}s</div>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div class="text-xs font-semibold uppercase text-slate-500 mb-1">Accuracy Status</div>
                        <div class="text-2xl font-bold ${att.score >= (att.total*0.7) ? 'text-emerald-600' : 'text-amber-600'}">${att.score >= (att.total*0.7) ? 'Proficient' : 'Needs Practice'}</div>
                    </div>
                </div>

                <h4 class="font-bold text-slate-900 mb-3">Topic-wise Strengths & Weaknesses</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    ${topics.map(t => {
                        const ts = topicSummary[t];
                        const acc = ts.total > 0 ? Math.round((ts.correct / ts.total) * 100) : 0;
                        const isWeak = ts.total > 0 && acc < 50;
                        return `
                            <div class="p-3.5 rounded-xl border ${isWeak ? 'bg-rose-50 border-rose-200' : 'bg-slate-50 border-slate-200'}">
                                <div class="text-xs font-bold uppercase text-slate-600 mb-1">${t}</div>
                                <div class="text-xl font-bold ${isWeak ? 'text-rose-600' : 'text-slate-900'}">${acc}%</div>
                                <div class="text-[11px] text-slate-500 mt-0.5">${ts.correct}/${ts.total} correct</div>
                                ${isWeak ? `<div class="mt-1 text-[10px] font-bold text-rose-700 bg-rose-200/60 px-2 py-0.5 rounded inline-block">Weak Area</div>` : ''}
                            </div>
                        `;
                    }).join('')}
                </div>

                <h4 class="font-bold text-slate-900 mb-3">Question-by-Question Review</h4>
                <div class="space-y-4">
                    ${att.responses.map((resp, idx) => {
                        const qObj = questions.find(q => q.id === resp.questionId);
                        if (!qObj) return '';
                        return `
                            <div class="p-4 rounded-xl border ${resp.isCorrect ? 'bg-emerald-50/40 border-emerald-200' : 'bg-rose-50/40 border-rose-200'}">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-bold px-2 py-0.5 bg-slate-100 text-slate-700 rounded">Q${idx + 1} (${escapeHtml(qObj.topic)})</span>
                                    <span class="text-xs font-bold px-2.5 py-1 rounded ${resp.isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${resp.isCorrect ? 'Correct' : 'Incorrect'}</span>
                                </div>
                                <p class="text-sm font-medium text-slate-900 mb-3">${escapeHtml(qObj.question)}</p>
                                <div class="text-xs space-y-1 mb-3">
                                    <div>Your Answer: <span class="font-semibold ${resp.isCorrect ? 'text-emerald-700' : 'text-rose-700'}">${resp.selectedOption !== null ? escapeHtml(qObj.options[resp.selectedOption]) : 'Not Answered'}</span></div>
                                    ${!resp.isCorrect ? `<div>Correct Answer: <span class="font-semibold text-emerald-700">${escapeHtml(qObj.options[qObj.correct])}</span></div>` : ''}
                                </div>
                                <div class="text-xs text-slate-600 bg-white p-3 rounded-lg border border-slate-200">
                                    <span class="font-semibold text-slate-800">Explanation:</span> ${escapeHtml(qObj.explanation)}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            document.getElementById('report-modal').classList.remove('hidden');
        }

        // HTML Escape Helper for security
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
